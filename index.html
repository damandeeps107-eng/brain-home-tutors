<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance | Brains Home Tutors</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');

    :root {
      --primary-orange: #F97316;
      --dark-bg: #0F172A;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--dark-bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    /* Animated Background Orbs */
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.5;
      animation: float 10s infinite alternate ease-in-out;
      z-index: 0;
    }

    .orb-1 {
      width: 400px;
      height: 400px;
      background: rgba(249, 115, 22, 0.3);
      top: -100px;
      left: -100px;
    }

    .orb-2 {
      width: 500px;
      height: 500px;
      background: rgba(30, 58, 138, 0.4);
      bottom: -150px;
      right: -100px;
      animation-delay: -5s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 50px) scale(1.1); }
    }

    /* Glassmorphism Card */
    .maintenance-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      padding: 3rem 4rem;
      max-width: 600px;
      width: 90%;
      text-align: center;
      z-index: 1;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(30px);
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo-container img {
      width: 90px;
      height: auto;
      margin-bottom: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(249, 115, 22, 0.2);
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #FFF, #CBD5E1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h1 span {
      color: var(--primary-orange);
      -webkit-text-fill-color: var(--primary-orange);
    }

    p {
      font-size: 1.1rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    /* Loader */
    .loader {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 2rem;
    }

    .dot {
      width: 10px;
      height: 10px;
      background: var(--primary-orange);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    .contact-info {
      padding-top: 2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .contact-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #FFF;
      font-weight: 600;
      font-size: 1.05rem;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .contact-item:hover {
      color: var(--primary-orange);
    }

    /* Include FontAwesome for icons */
    @import url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css');
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Background Effects -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <!-- Main Card -->
  <div class="maintenance-card">
    <div class="logo-container">
      <img src="assets/logo.png" alt="Brains Home Tutors Logo">
    </div>
    
    <h1>We are <span>Upgrading</span></h1>
    
    <div class="loader">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    
    <p>We are currently performing some scheduled maintenance to bring you an even better experience. We'll be back online shortly!</p>
    
    <div class="contact-info">
      <p style="margin-bottom: 0.5rem; font-size: 0.95rem;">Need immediate assistance?</p>
      <a href="tel:9419291913" class="contact-item">
        <i class="fa-solid fa-phone"></i> Call: 9419291913
      </a>
      <a href="https://wa.me/919419291913" class="contact-item" target="_blank">
        <i class="fa-brands fa-whatsapp" style="color: #25D366;"></i> WhatsApp Us
      </a>
    </div>
  </div>

</body>
</html>
